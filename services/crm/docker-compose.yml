# CRM Backend — Docker Compose orchestration
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: crm-db
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: crm-api
    environment:
      DATABASE_URL: postgresql+asyncpg://crm_user:crm_pass@db:5432/crm_db
      DATABASE_URL_SYNC: postgresql+psycopg2://crm_user:crm_pass@db:5432/crm_db
      JWT_SECRET_KEY: development-secret-change-in-production
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
