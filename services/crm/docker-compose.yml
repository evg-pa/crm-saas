# CRM Backend — Docker Compose orchestration (standalone backend)
# For full stack, use the root docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: crm-db
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crm-network

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - crm-network

  api:
    build: .
    container_name: crm-api
    environment:
      DATABASE_URL: postgresql+asyncpg://crm_user:crm_pass@db:5432/crm_db
      DATABASE_URL_SYNC: postgresql+psycopg2://crm_user:crm_pass@db:5432/crm_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: development-secret-change-in-production
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
